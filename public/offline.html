<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hors ligne — Moncolis</title>
  <meta name="theme-color" content="#0b0f19">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0f19;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.2rem 1.8rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-container {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.3);
      animation: pulse 2.2s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #60a5fa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }
    p {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      transition: all 0.3s ease;
    }
    .status-badge.online {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.35);
      color: #4ade80;
    }
    .btn-retry {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: transform 0.1s ease, filter 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    .tip {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      📦 MONCOLIS
    </div>

    <div class="icon-container">
      <div class="icon-pulse"></div>
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Connexion Internet requise</h1>

    <div id="statusBadge" class="status-badge">
      <span>●</span> <span id="statusText">Hors ligne</span>
    </div>

    <p>
      Moncolis a besoin d'une connexion Internet active pour synchroniser vos colis, les versements et le suivi en temps réel.
    </p>

    <button id="retryBtn" class="btn-retry" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      Réessayer la connexion
    </button>

    <div class="tip">
      Dès que votre connexion sera rétablie, la page se rechargera automatiquement.
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');

    function checkConnection() {
      if (navigator.onLine) {
        statusBadge.classList.add('online');
        statusText.textContent = 'Connexion détectée ! Rechargement...';
        setTimeout(() => {
          window.location.reload();
        }, 800);
      } else {
        statusBadge.classList.remove('online');
        statusText.textContent = 'Hors ligne';
      }
    }

    retryBtn.addEventListener('click', () => {
      retryBtn.style.opacity = '0.7';
      retryBtn.textContent = 'Vérification...';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          retryBtn.style.opacity = '1';
          retryBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            Réessayer la connexion
          `;
        }, 1000);
      }
    });

    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
    setInterval(() => {
      if (navigator.onLine) checkConnection();
    }, 4000);
  </script>
</body>
</html>
